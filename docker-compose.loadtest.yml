# Entorno aislado para pruebas de carga, sobre el compose base (sin dev ni prod):
#   docker compose -p ecocampus-loadtest -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build
# El proyecto "ecocampus-loadtest" crea su propio volumen de MySQL, asi que no toca los datos del estudio.
# REQUIERE_LOGIN=false permite medir POST /api/respuestas sin sesion SAML (queda con id y correo nulos).
# No publica puertos: k6 corre dentro de la red del proyecto (ver docs/testing/rendimiento.md).
services:
  backend:
    environment:
      REQUIERE_LOGIN: "false"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4006
        VITE_EXPERIMENTO_ACTIVO: "true"
