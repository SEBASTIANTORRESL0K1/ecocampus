name: Deploy to Lightsail

# Despliega en el servidor de AWS Lightsail por SSH: git checkout del commit + docker compose up -d --build,
# con verificacion y regreso automatico a la version anterior si falla (ver deploy/desplegar.sh).
# Guia de configuracion (secrets, environment y servidor): docs/despliegue-lightsail.md
on:
  push:
    branches: [production]
    paths-ignore:
      - "docs/**"
      - "loadtest/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; el que esta en curso no se cancela a la mitad
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  desplegar:
    name: Desplegar en Lightsail
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Con revisores requeridos en el Environment, el job espera la aprobacion manual antes de tocar el servidor
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Desplegar
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ecocampus' }}
          SITIO_URL: ${{ vars.SITIO_URL }}
        run: |
          set -euo pipefail
          # %q escapa cada valor para el shell remoto (un valor vacio queda como '')
          ARGS="$(printf '%q ' "$GITHUB_SHA" "$DEPLOY_PATH" "$SITIO_URL")"
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "bash -s -- $ARGS" < deploy/desplegar.sh

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
