# Base comun a todos los entornos. No se usa sola: se combina con un archivo de entorno.
#   Desarrollo:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Produccion:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (o define COMPOSE_FILE en .env; ver .env.dev.example y .env.prod.example)
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ecocampus
      MYSQL_USER: ecocampus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ecocampus
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ecocampus
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET en .env}
      ID_SALT: ${ID_SALT:?define ID_SALT en .env}
      REQUIERE_LOGIN: ${REQUIERE_LOGIN:-true}
      # SAML: vacio = valores de desarrollo del asesor (ver backend/app.js)
      SAML_ISSUER: ${SAML_ISSUER:-}
      SAML_CALLBACK_URL: ${SAML_CALLBACK_URL:-}
      SAML_LOGOUT_CALLBACK_URL: ${SAML_LOGOUT_CALLBACK_URL:-}
      SAML_ENTRY_POINT: ${SAML_ENTRY_POINT:-}
      SAML_LOGOUT_URL: ${SAML_LOGOUT_URL:-}
      SAML_CLOCK_SKEW_MS: ${SAML_CLOCK_SKEW_MS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db_data:
