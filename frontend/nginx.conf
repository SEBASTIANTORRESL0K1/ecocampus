server {
  listen 80;
  root /usr/share/nginx/html;
  # Redirecciones relativas: detras de un proxy/HTTPS no deben incluir host, puerto ni esquema internos
  absolute_redirect off;

  location = / {
    return 301 /ecocampus/;
  }

  # SPA con basename /ecocampus: cualquier ruta cae en index.html
  location /ecocampus/ {
    try_files $uri /ecocampus/index.html;
  }

  location /ecocampus/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
